spring.application.name=volunteer-scheduling-system

# ---- Server ----
server.port=${PORT:8080}

# ---- Parameterised environment settings (overridden by Jenkins/Docker/Ansible) ----
app.name=Volunteer Scheduling System
app.env=${APP_ENV:dev}
app.version=${APP_VERSION:@project.version@}

# ---- Database (H2, file or in-memory; override with DB_URL) ----
spring.datasource.url=${DB_URL:jdbc:h2:mem:vss;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}

# ---- Seed demo slots on startup ----
app.seed-data=${SEED_DATA:true}

# ---- Actuator (health check for Docker/Ansible/Jenkins) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${app.name}
info.app.environment=${app.env}
info.app.version=${app.version}

spring.thymeleaf.cache=false
