<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="card">
        <h1 id="page-title">Volunteer registration</h1>
        <div th:if="${error}" id="error-box" class="alert alert-error" th:text="${error}"></div>
        <form id="register-form" th:action="@{/register}" th:object="${volunteer}" method="post">
            <label for="fullName">Full name</label>
            <input id="fullName" type="text" th:field="*{fullName}" placeholder="e.g. Priya Sharma">
            <div class="alert alert-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="you@example.com">
            <div class="alert alert-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label for="phone">Phone</label>
            <input id="phone" type="text" th:field="*{phone}" placeholder="9876543210">
            <div class="alert alert-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

            <label for="skills">Skills (optional)</label>
            <input id="skills" type="text" th:field="*{skills}" placeholder="teaching, first-aid, driving">

            <p><button id="btn-register" class="btn btn-success" type="submit">Register</button></p>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
