<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="card">
        <h1 id="page-title">Available slots</h1>
        <div th:if="${success}" id="success-box" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" id="error-box" class="alert alert-error" th:text="${error}"></div>
        <p th:if="${#lists.isEmpty(slots)}">No slots published yet. Please check back later.</p>
        <table th:unless="${#lists.isEmpty(slots)}" id="slots-table">
            <thead>
            <tr><th>Shift</th><th>Event</th><th>Location</th><th>Date</th><th>Time</th><th>Seats left</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="slot : ${slots}">
                <td th:text="${slot.title}">Title</td>
                <td th:text="${slot.eventName}">Event</td>
                <td th:text="${slot.location}">Location</td>
                <td th:text="${slot.slotDate}">2026-01-01</td>
                <td th:text="${slot.startTime} + ' - ' + ${slot.endTime}">09:00 - 12:00</td>
                <td>
                    <span th:text="${seatsLeft[slot.id]}">5</span>
                    <span th:if="${seatsLeft[slot.id] == 0}" class="status status-CANCELLED">Full</span>
                </td>
                <td>
                    <a th:if="${seatsLeft[slot.id] > 0}" class="btn btn-book"
                       th:href="@{'/slots/' + ${slot.id} + '/book'}">Book</a>
                    <button th:if="${seatsLeft[slot.id] == 0}" class="btn" disabled>Full</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
