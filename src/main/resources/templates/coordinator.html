<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="card">
        <h1 id="page-title">Coordinator dashboard</h1>
        <div th:if="${success}" id="success-box" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" id="error-box" class="alert alert-error" th:text="${error}"></div>
        <h2>All bookings</h2>
        <p th:if="${#lists.isEmpty(bookings)}">No bookings yet.</p>
        <table th:unless="${#lists.isEmpty(bookings)}" id="all-bookings-table">
            <thead><tr><th>Reference</th><th>Volunteer</th><th>Slot</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td class="booking-ref" th:text="${b.reference}">VSS-XXXXXX</td>
                <td th:text="${b.volunteer.fullName} + ' (' + ${b.volunteer.email} + ')'">Name</td>
                <td th:text="${b.slot.title} + ' @ ' + ${b.slot.slotDate}">Slot</td>
                <td><span class="status" th:classappend="'status-' + ${b.status}" th:text="${b.status}">PENDING</span></td>
                <td>
                    <form class="inline" th:if="${b.status.name() == 'PENDING'}"
                          th:action="@{'/coordinator/bookings/' + ${b.reference} + '/confirm'}" method="post">
                        <button class="btn btn-success btn-confirm" type="submit">Confirm</button>
                    </form>
                    <form class="inline" th:if="${b.status.name() != 'CANCELLED'}"
                          th:action="@{'/coordinator/bookings/' + ${b.reference} + '/cancel'}" method="post">
                        <button class="btn btn-danger btn-cancel" type="submit">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card">
        <h2>Create a new slot</h2>
        <form id="slot-form" th:action="@{/coordinator/slots}" th:object="${slot}" method="post">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}">
            <label for="eventName">Event name</label>
            <input id="eventName" type="text" th:field="*{eventName}">
            <label for="location">Location</label>
            <input id="location" type="text" th:field="*{location}">
            <label for="slotDate">Date</label>
            <input id="slotDate" type="date" th:field="*{slotDate}">
            <label for="startTime">Start time</label>
            <input id="startTime" type="time" th:field="*{startTime}">
            <label for="endTime">End time</label>
            <input id="endTime" type="time" th:field="*{endTime}">
            <label for="capacity">Capacity</label>
            <input id="capacity" type="number" min="1" th:field="*{capacity}">
            <label for="description">Description</label>
            <input id="description" type="text" th:field="*{description}">
            <p><button id="btn-create-slot" class="btn" type="submit">Create slot</button></p>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
