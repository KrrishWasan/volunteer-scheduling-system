<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="card">
        <h1 id="page-title">Book slot</h1>
        <div th:if="${error}" id="error-box" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${slot}">
            <p><strong th:text="${slot.title}">Title</strong>
                &middot; <span th:text="${slot.eventName}">Event</span>
                &middot; <span th:text="${slot.location}">Location</span></p>
            <p>Date: <span th:text="${slot.slotDate}">date</span>,
                <span th:text="${slot.startTime}">start</span> - <span th:text="${slot.endTime}">end</span>
                &middot; Seats left: <strong id="seats-left" th:text="${seatsLeft}">0</strong></p>
            <form id="book-form" th:action="@{'/slots/' + ${slot.id} + '/book'}" method="post">
                <label for="email">Your registered e-mail</label>
                <input id="email" type="email" name="email" th:value="${email}" placeholder="you@example.com" required>
                <p><button id="btn-book" class="btn btn-success" type="submit">Request booking</button></p>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
